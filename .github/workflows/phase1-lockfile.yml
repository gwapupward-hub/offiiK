name: Synchronize Phase 1 lockfile

on:
  push:
    branches:
      - agent/phase-1-foundation-v2
    paths:
      - .github/workflows/phase1-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-1-foundation-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: isnad/package-lock.json

      - name: Synchronize package lock
        working-directory: isnad
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isnad/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "Synchronize Phase 1 package lock"
            git push origin HEAD:agent/phase-1-foundation-v2
          fi
